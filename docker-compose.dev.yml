# ChatbotX — override DEV (diferencias respecto al stack común)
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml -f docker-compose.dev.yml up -d
#
# Este archivo solo declara lo que CAMBIA en dev respecto al stack base:
# - seed de datos demo al arrancar
# - log level debug
# - Caddy como reverse proxy (dominio dev + HTTPS automático)

services:
  builder:
    environment:
      - RUN_DB_MIGRATE=true
      - RUN_DB_SEED=true
      - LOG_LEVEL=debug

  worker:
    environment:
      - LOG_LEVEL=debug

  realtime:
    environment:
      - LOG_LEVEL=debug

  # Reverse proxy: da HTTPS + dominio y reparte el tráfico a los servicios
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - builder
      - realtime
      - filesystem
    networks:
      - chatbotx-network

volumes:
  caddy-data:
  caddy-config:
